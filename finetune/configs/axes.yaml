# 多样性轴配置
#
# ┌──────────────────────────────────────────────────────────────────┐
# │ 这个文件由人编写，不由代理生成。                                    │
# │ 它直接决定合成数据多样性的上限——代理写出来的会很平。                │
# │                                                                  │
# │ 下面是起步框架。你要做的三件事（约 40 分钟）：                       │
# │   1. 删掉不像你们产品会遇到的场景                                   │
# │   2. 补上你实际见过的场景（这一项最值钱，我没有你的领域经验）          │
# │   3. 把 domain 里带 ← 的那几条按你的判断改写                        │
# │                                                                  │
# │ 硬要求：domain_zh 与 domain_en 各 ≥ 10 项，format ≥ 8，tone ≥ 4。   │
# │ 组合空间需 ≥ 10×8×4×4 = 1280 种。                                 │
# └──────────────────────────────────────────────────────────────────┘

# ---------------------------------------------------------------- 场景
# 一半以上应来自「用户真的会拿来脱敏的文本」，不是泛泛的日常场景。
domain_zh:
  - 设备维修工单
  - 医院门诊登记与挂号记录
  - 快递物流面单与客服跟进
  - 租房带看与合同签署记录
  - 银行/保险客户回访
  - 校园教务与学生事务
  - 政务办事大厅咨询记录
  - 电商售后纠纷处理
  - 人力资源招聘与入职材料
  - 社区物业报事报修
  - 法律咨询与调解笔录          # ← 不确定你们会不会遇到，按需删改
  - 企业内部 IT 服务台工单

domain_en:
  # 英文场景要用英语国家真实存在的形态，不要把中文场景直译
  - customer support ticket
  - hospital patient intake form
  - parcel delivery exception report
  - apartment rental application
  - bank account service call log
  - university student services email
  - HR onboarding paperwork
  - e-commerce return dispute thread
  - IT helpdesk incident record
  - insurance claim correspondence
  - property maintenance request     # ← 按需删改
  - conference attendee registration

# ---------------------------------------------------------------- 文体
format:
  - 工单系统条目
  - 即时通讯聊天记录
  - 电子邮件正文
  - 表单/登记表填写内容
  - 内部通知公告
  - 会议纪要
  - 电话录音转写稿
  - 客服对话记录
  - 论坛或社交平台发帖
  - 内部备忘录

# ---------------------------------------------------------------- 语气
tone:
  - 正式书面
  - 口语随意
  - 急躁抱怨
  - 简略电报体
  - 冗长啰嗦

# ---------------------------------------------------------------- 标签组合
# 每批注入 4 个标签（规格「标签体系」）。组合要场景上说得通，
# 不要随机取 4 个——银行回访里出现 PASSPORT 很怪。
label_groups:
  - [PERSON, PHONE, ADDRESS, ORG]        # 工单、物流、报修
  - [PERSON, PHONE, ID_CARD, ORG]        # 挂号、政务、入职
  - [PERSON, EMAIL, ORG, LOCATION]       # 邮件、招聘、会务
  - [PERSON, PHONE, BANK_CARD, ORG]      # 银行、保险、售后退款
  - [PERSON, PASSPORT, LOCATION, ORG]    # 出入境、会务、跨境物流
  - [PERSON, EMAIL, PHONE, ADDRESS]      # 电商、租房
  - [ORG, LOCATION, ADDRESS, PHONE]      # 机构信息为主、弱个人
  - [PERSON, ORG, LOCATION, EMAIL]       # 校园、社区

# 注意：英文样本不使用 ID_CARD（规格「标签体系」）。
# 生成英文时，含 ID_CARD 的组合自动替换为 PASSPORT。

# ---------------------------------------------------------------- 陷阱
# 硬负样本里埋的「像 PII 但不是」的串。每种至少给 3 个例子，
# 生成时随机选，并在 gold 的 trap_spans 里记录位置。
traps:
  店名含姓氏:
    - 王记牛肉面
    - 老李修车行
    - 陈氏中医诊所
  服务号非个人号码:
    - "10086"
    - "12345"
    - "95588"
  型号或订单号像身份证:
    - "SN2019081512340078"
    - "OD31010419980322145"
  型号或订单号像护照号:
    - "EA1234567"
    - "GK987654"
    - "SP2024001"
  公众人物或历史人物:
    - 鲁迅
    - 爱因斯坦
    - 苏轼
  公开机构名:
    - 国家统计局
    - 世界卫生组织
